name: KANA Vercel Core Build

on:
  push:
    branches: [vercel-kana-core]
  pull_request:
    branches: [main, vercel-kana-core]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
